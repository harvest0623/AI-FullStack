# ============================================================
# 文件名：02-deploy-nginx-reverse-proxy.conf
# 用途：Nginx 反向代理完整配置文件
# 场景：电商服务器 192.168.1.100 Nginx 反向代理 Node.js 多实例
# 说明：包含 upstream 负载均衡、proxy_pass、HTTPS、gzip
#       静态文件缓存、WebSocket 支持、性能调优参数
# 部署：sudo cp 02-deploy-nginx-reverse-proxy.conf /etc/nginx/sites-available/ecommerce
#       sudo ln -s /etc/nginx/sites-available/ecommerce /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ------------------------------------------------------------
# 全局性能调优参数（放在 nginx.conf 的 http {} 块中）
# ------------------------------------------------------------
# worker_processes auto;           # 工作进程数=CPU核数
# worker_connections 10240;        # 每进程最大连接数
# worker_rlimit_nofile 65535;      # 文件描述符上限
# multi_accept on;                 # 一次接受多个连接
# use epoll;                       # 事件模型（Linux）

# ------------------------------------------------------------
# 站点配置（放在 sites-available/ 目录，软链到 sites-enabled/）
# ------------------------------------------------------------

# upstream 定义后端服务器组（Node.js 多实例负载均衡）
upstream ecommerce_backend {
    # 负载均衡策略（三选一）：
    # 1. 轮询（默认）：按顺序轮流分配
    # 2. ip_hash：同一 IP 固定到同一后端（会话保持）
    # 3. least_conn：分配给连接数最少的后端

    ip_hash;  # 启用会话保持（如需）

    # Node.js 多实例（PM2 集群模式启动的 4 个实例）
    server 127.0.0.1:3000 weight=3;   # 主实例，权重高
    server 127.0.0.1:3001 weight=2;   # 备实例
    server 127.0.0.1:3002 weight=2;
    server 127.0.0.1:3003 weight=1;

    # 健康检查参数
    keepalive 32;           # 保持 32 个长连接到后端
    keepalive_timeout 60s;  # 长连接超时

    # 故障转移：某实例 10 秒内失败 3 次则标记为宕机，30 秒后重试
    # 需要配合 proxy_next_upstream 使用
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # 所有 HTTP 请求重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS 主站点配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # ------------------------------------------------------------
    # SSL 证书配置（Let's Encrypt / certbot 自动配置）
    # ------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # SSL 优化配置
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # 只允许 TLS 1.2 和 1.3（禁用旧版本）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS（强制浏览器使用 HTTPS）
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ------------------------------------------------------------
    # 安全头
    # ------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------
    # 上传文件大小限制（根据业务调整）
    # ------------------------------------------------------------
    client_max_body_size 20m;

    # ------------------------------------------------------------
    # gzip 压缩配置
    # ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-javascript
        application/x-font-ttf
        application/vnd.ms-fontobject
        image/svg+xml
        font/woff2;

    # ------------------------------------------------------------
    # 日志配置
    # ------------------------------------------------------------
    access_log /var/log/nginx/ecommerce-access.log;
    error_log /var/log/nginx/ecommerce-error.log;

    # 日志格式（包含响应时间，便于性能分析）
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';

    # ------------------------------------------------------------
    # 静态文件处理（Nginx 直接返回，不走 Node.js）
    # ------------------------------------------------------------
    # 静态文件根目录
    root /opt/ecommerce/backend/public;
    index index.html;

    # 静态文件缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;                          # 缓存 1 年
        add_header Cache-Control "public, immutable";
        access_log off;                      # 静态文件不记访问日志
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # API 反向代理到 Node.js 后端
    # ------------------------------------------------------------
    location /api/ {
        # 反向代理到 upstream 后端服务器组
        proxy_pass http://ecommerce_backend;

        # 传递请求头到后端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 传递 HTTP 版本（支持 keepalive）
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 超时设置
        proxy_connect_timeout 30s;    # 连接后端超时
        proxy_send_timeout 60s;       # 发送请求超时
        proxy_read_timeout 60s;       # 读取响应超时

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # 故障转移：后端出错时尝试下一个实例
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # ------------------------------------------------------------
    # WebSocket 支持（实时通信/聊天/通知）
    # ------------------------------------------------------------
    location /ws/ {
        proxy_pass http://ecommerce_backend;

        # WebSocket 必需的请求头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时（默认 60s 太短）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ------------------------------------------------------------
    # 健康检查端点（Nginx 自身）
    # ------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ------------------------------------------------------------
    # 状态监控端点（限制内网访问）
    # ------------------------------------------------------------
    location /nginx_status {
        stub_status on;
        access_log off;
        # 只允许内网访问
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;
    }

    # ------------------------------------------------------------
    # 限制访问的路径（管理后台等）
    # ------------------------------------------------------------
    location /admin/ {
        # 只允许内网访问管理后台
        allow 192.168.1.0/24;
        deny all;

        proxy_pass http://ecommerce_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------
    # 限流配置（防爬虫/DDoS）
    # ------------------------------------------------------------
    # 在 http 块中定义：
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    location /api/login {
        # 登录接口限流：每秒 5 个请求，突发 10 个
        # limit_req zone=login_limit burst=10 nodelay;
        # limit_conn conn_limit 10;

        proxy_pass http://ecommerce_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------
    # 前端路由（SPA 单页应用，所有路由返回 index.html）
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    # 自定义错误页面
    # ------------------------------------------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /opt/ecommerce/backend/public;
        internal;
    }
}

# ------------------------------------------------------------
# 部署步骤
# ------------------------------------------------------------
# 1. 复制配置文件到 sites-available
#    sudo cp 02-deploy-nginx-reverse-proxy.conf /etc/nginx/sites-available/ecommerce
#
# 2. 创建软链接到 sites-enabled
#    sudo ln -s /etc/nginx/sites-available/ecommerce /etc/nginx/sites-enabled/
#
# 3. 删除默认站点（可选）
#    sudo rm /etc/nginx/sites-enabled/default
#
# 4. 测试配置语法
#    sudo nginx -t
#
# 5. 重新加载 Nginx
#    sudo systemctl reload nginx
#
# 6. 申请 HTTPS 证书（Let's Encrypt）
#    sudo certbot --nginx -d example.com -d www.example.com
#
# 7. 验证
#    curl -I https://example.com
#    curl -I http://example.com  # 应重定向到 HTTPS

# ------------------------------------------------------------
# 性能调优参数说明
# ------------------------------------------------------------
# worker_processes auto        → 工作进程数自动匹配 CPU 核数
# worker_connections 10240     → 每个进程最大连接数（高并发需调大）
# client_max_body_size 20m     → 上传文件大小限制（根据业务调整）
# gzip on                      → 开启压缩（减少带宽）
# keepalive_timeout 65         → 客户端长连接超时
# sendfile on                  → 零拷贝传输（提升静态文件性能）
# tcp_nopush on                → 数据包合并发送
# tcp_nodelay on               → 禁用 Nagle 算法（降低延迟）

# ------------------------------------------------------------
# upstream 负载均衡策略说明
# ------------------------------------------------------------
# 轮询（默认）    → server 127.0.0.1:3000; server 127.0.0.1:3001;
# 权重            → server 127.0.0.1:3000 weight=3; server 127.0.0.1:3001 weight=1;
# ip_hash         → ip_hash; （同一 IP 固定到同一后端，会话保持）
# least_conn      → least_conn; （分配给连接数最少的后端）
# fair（第三方）  → fair; （按响应时间分配，需安装模块）
