# ============================================================
# 四、copytruncate 模式示例（适合不支持信号重开日志的应用）
# ============================================================
# copytruncate 复制旧文件后截断原文件，无需重启服务
# 适用于：Node.js 直接写文件、不响应 USR1 信号的应用
#
# /opt/ecommerce/logs/app-copytruncate.log {
#     daily
#     rotate 30
#     compress
#     delaycompress
#     missingok
#     notifempty
#     dateext
#     copytruncate              # 复制后截断原文件（不重启服务）
#     # 注意：copytruncate 不需要 create 和 postrotate
#     # 缺点：复制与截断之间可能丢失少量日志
# }

# ============================================================
# 五、配置参数说明速查
# ============================================================
# daily / weekly / monthly     轮转周期
# rotate N                     保留 N 个旧文件
# size 100M                    达到大小轮转
# compress                     gzip 压缩旧文件
# delaycompress                延迟一轮压缩（最新的旧文件不压缩）
# missingok                    文件不存在不报错
# notifempty                   空文件不轮转
# create 644 user group        创建新文件并指定权限属主
# dateext                      用日期做扩展名
# copytruncate                 复制后截断（不重启服务）
# sharedscripts                多日志匹配时脚本只执行一次
# postrotate ... endscript     轮转后执行脚本
# prerotate ... endscript      轮转前执行脚本
# olddir /path                 旧文件移到指定目录
# mail address                 轮转后发送旧文件到邮箱
# su user group                以指定用户身份执行轮转
