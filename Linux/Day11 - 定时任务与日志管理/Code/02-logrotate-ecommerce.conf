# ============================================================
# 文件名：02-logrotate-ecommerce.conf
# 用途：logrotate 配置——为电商项目 /opt/ecommerce/logs/ 配置日志轮转
#       同时包含 Nginx 日志轮转示例
# 场景：电商项目服务器（Ubuntu 22.04 LTS，项目部署在 /opt/ecommerce/）
# 部署：sudo cp 02-logrotate-ecommerce.conf /etc/logrotate.d/ecommerce
# 调试：sudo logrotate -d /etc/logrotate.d/ecommerce    （dry run）
# 执行：sudo logrotate -f /etc/logrotate.d/ecommerce    （强制轮转）
# 依赖：logrotate（Ubuntu 默认已安装）
# ============================================================

# ============================================================
# 一、电商项目应用日志轮转
# ============================================================
# 匹配 /opt/ecommerce/logs/ 下所有 .log 文件
/opt/ecommerce/logs/*.log {
    # ---------- 轮转周期 ----------
    daily                   # 每天轮转（也可 weekly / monthly）
    # size 100M             # 达到 100M 也轮转（与 daily 是“或”关系，先到先轮转）

    # ---------- 保留数量 ----------
    rotate 30               # 保留 30 个旧文件（约一个月的历史日志）

    # ---------- 压缩 ----------
    compress                # 用 gzip 压缩旧文件
    delaycompress           # 延迟一轮再压缩（最新的旧文件不压缩，便于排查）

    # ---------- 行为选项 ----------
    missingok               # 日志文件不存在不报错（首次部署时目录可能为空）
    notifempty              # 空文件不轮转
    dateext                 # 用日期做扩展名（如 app.log-20260729，而非 app.log.1）
    dateformat -%Y%m%d      # 日期格式（默认 -%Y%m%d）

    # ---------- 新文件权限 ----------
    create 644 deploy deploy    # 轮转后创建新文件，属主 deploy:deploy，权限 644

    # ---------- 轮转后脚本 ----------
    sharedscripts           # 多个日志匹配时，postrotate 脚本只执行一次
    postrotate
        # 通知 Node.js 应用重新打开日志文件（发送 USR1 信号）
        # 若应用用 PM2 管理，可用 pm2 reloadLogs 替代
        if [ -f /var/run/ecommerce/ecommerce.pid ]; then
            kill -USR1 $(cat /var/run/ecommerce/ecommerce.pid) 2>/dev/null || true
        fi
        # 或者用 PM2 的方式：
        # /usr/bin/pm2 reloadLogs 2>/dev/null || true
    endscript
}

# ============================================================
# 二、Nginx 访问与错误日志轮转
# ============================================================
# Nginx 通常用 postrotate + kill -USR1 让其重新打开日志文件
/var/log/nginx/*.log {
    daily
    rotate 14               # 保留 14 天
    compress
    delaycompress
    missingok
    notifempty
    dateext
    create 640 www-data adm   # Ubuntu 下 Nginx 运行用户 www-data，日志组 adm

    sharedscripts
    postrotate
        # 向 Nginx master 进程发送 USR1 信号，重新打开日志文件
        # 不需要 restart，不会中断服务
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 $(cat /var/run/nginx.pid) 2>/dev/null || true
        fi
    endscript
}

