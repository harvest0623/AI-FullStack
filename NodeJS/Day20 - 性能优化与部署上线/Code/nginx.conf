# nginx.conf - Nginx 反向代理示例
# ------------------------------------------------------------
# 作用: 在 Node.js 前面做一层反向代理, 承担 SSL 终止、负载均衡、
#       gzip 压缩、静态资源托管, 让 Node 专注业务逻辑
# 部署: nginx -c /etc/nginx/nginx.conf  或放进 /etc/nginx/conf.d/app.conf
# ------------------------------------------------------------

# ---- 工作进程: 通常等于 CPU 核数 ----
worker_processes auto;

events {
    worker_connections 1024;   # 每个 worker 的最大连接数
}

http {
    # ---- 基础类型映射 ----
    include       mime.types;
    default_type  application/octet-stream;

    # ---- 日志格式: 生产常用 combined + upstream 响应耗时 ----
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---- upstream: 负载均衡到多个 Node 实例 (PM2 cluster / 多容器) ----
    # 默认轮询(round-robin); 可配 least_conn(最少连接) / ip_hash(会话保持)
    upstream node_app {
        # 呼应 PM2 cluster: 这里指向同机多端口; 多机部署换成各机器内网 IP
        server 127.0.0.1:3000 weight=1;
        server 127.0.0.1:3001 weight=1;
        server 127.0.0.1:3002 weight=1;

        # keepalive 到上游的长连接, 避免每次请求都新建 TCP (需配合 proxy_http_version 1.1)
        keepalive 32;
    }

    # ---- gzip 压缩: 显著减小文本响应体积 ----
    gzip on;
    gzip_vary on;                       # 让代理缓存区分压缩/未压缩
    gzip_min_length 1024;               # 小于 1KB 不压缩, 节省 CPU
    gzip_comp_level 6;                  # 压缩级别 1-9, 6 是性价比之选
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/xml+rss text/javascript;

    # ---- 服务入口 ----
    server {
        listen 80;
        server_name api.example.com;

        # HTTP 强制跳转 HTTPS (安全基线)
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;           # HTTP/2 需在 https 下生效
        server_name api.example.com;

        # ---- SSL 终止: 证书由 Nginx 持有, 后端 Node 走明文 http ----
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # HSTS: 强制浏览器后续都走 HTTPS, 防止降级攻击 (max-age 按需调大)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---- 静态资源: Nginx 直接托管, 不进 Node ----
        # 路径前缀 /static 映射到磁盘目录, 配合强缓存
        location /static/ {
            alias /var/www/static/;
            expires 30d;                        # 浏览器强缓存 30 天
            add_header Cache-Control "public, immutable";
            access_log off;                     # 静态资源不打 access 日志, 降噪
        }

        # ---- API 反向代理到 Node upstream ----
        location / {
            proxy_pass http://node_app;

            # HTTP/1.1 + 长连接: 与 upstream keepalive 配合, 复用 TCP 连接
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 透传客户端真实信息 (否则 Node 看到的都是 Nginx 的 IP)
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时控制: 避免慢请求拖垮 Node
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # 上游错误时的兜底: 502/504 时返回友好 JSON
            error_page 502 503 504 /50x.json;
        }

        # 健康检查端点: 直接由 Nginx 返回, 不打扰 Node (探活用, 就绪仍走 Node)
        location = /ping {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /50x.json {
            add_header Content-Type application/json;
            return 503 '{"code":"UPSTREAM_ERROR","message":"服务暂不可用, 请稍后重试"}';
        }
    }
}
