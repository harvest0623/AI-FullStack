# ============================================================
# NestJS Day15 Nginx 反向代理配置
# 职责：HTTPS 终止、负载均衡、限流、静态文件、压缩
# 部署到 /etc/nginx/conf.d/default.conf
# ============================================================

# ---------- 上游应用集群（多实例负载均衡）----------
upstream nest_backend {
    # least_conn：把请求转发给连接数最少的服务器
    least_conn;
    server app:3000 weight=5 max_fails=3 fail_timeout=30s;
    # 如有多个实例，可继续追加：
    # server app2:3000 weight=5 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ---------- 限流区：每个 IP 10 req/s ----------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---------- 主服务 ----------
server {
    listen 80;
    server_name _;

    # 客户端请求体大小限制（影响文件上传）
    client_max_body_size 20m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ---------- 健康检查（直接走应用 /health）----------
    location = /health {
        proxy_pass http://nest_backend/api/v1/health;
        access_log off;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://nest_backend;
        proxy_http_version 1.1;

        # WebSocket 支持（如果用到 Gateway）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 透传客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 保持长连接，减少握手开销
        proxy_set_header Connection "";

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 大文件上传缓冲
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 静态文件（如使用 @nestjs/serve-static 托管前端）----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存 7 天
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 安全头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
